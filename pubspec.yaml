name: effective_flutter_course
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  intl: any
  json_annotation: ^4.9.0
  bloc: ^9.0.0
  dio: ^5.8.0+1
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  device_preview: ^1.2.0
  build_runner: ^2.4.13
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true
  generate: true
  assets:
   - assets/images/placeholder.png
   - assets/images/tea.png
   - assets/images/authors_drink.png
   - assets/images/black_coffee.png
   - assets/images/coffee_with_milk.png
